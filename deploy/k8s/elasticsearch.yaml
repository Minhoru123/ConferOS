# Dev-only single node Elasticsearch with security off. Use Elastic Cloud or a hardened deployment for anything real.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: elasticsearch
  labels: { app: elasticsearch }
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: { app: elasticsearch }
  template:
    metadata:
      labels: { app: elasticsearch }
    spec:
      containers:
        - name: elasticsearch
          image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
          env:
            - { name: discovery.type, value: single-node }
            - { name: xpack.security.enabled, value: "false" }
            - { name: ES_JAVA_OPTS, value: "-Xms512m -Xmx512m" }
          ports:
            - containerPort: 9200
          readinessProbe:
            httpGet: { path: /_cluster/health, port: 9200 }
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests: { memory: 1Gi, cpu: 250m }
            limits: { memory: 1536Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: elasticsearch
spec:
  selector: { app: elasticsearch }
  ports:
    - port: 9200
      targetPort: 9200
