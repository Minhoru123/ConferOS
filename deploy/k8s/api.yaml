apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  labels: { app: api }
spec:
  # One replica on purpose. Live updates are fanned out inside each API process, so with two pods a viewer only
  # sees lines posted to its own pod, and each pod numbers segments on its own. Scaling out needs shared
  # numbering (an Elasticsearch counter) and shared fan-out (for example Redis pub/sub). Recreate avoids two pods overlapping.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: { app: api }
  template:
    metadata:
      labels: { app: api }
    spec:
      containers:
        - name: api
          image: backchannel-api:dev
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8787
          env:
            - { name: ELASTICSEARCH_URL, value: "http://elasticsearch:9200" }
            - { name: OTEL_SERVICE_NAME, value: backchannel-api }
          # Create this Secret with the OTLP endpoint and auth header (see README). Optional so the app runs without it.
          envFrom:
            - secretRef: { name: otel, optional: true }
          readinessProbe:
            httpGet: { path: /health, port: 8787 }
          livenessProbe:
            httpGet: { path: /health, port: 8787 }
            initialDelaySeconds: 10
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { memory: 512Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: api
spec:
  selector: { app: api }
  ports:
    - port: 8787
      targetPort: 8787
