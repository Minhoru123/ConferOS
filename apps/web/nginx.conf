server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  location /api/ {
    proxy_pass http://api:8787;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    # Server-sent events need buffering off so live transcript lines arrive immediately.
    proxy_buffering off;
    proxy_read_timeout 1h;
  }

  location /health {
    proxy_pass http://api:8787;
  }

  location / {
    try_files $uri /index.html;
  }
}
