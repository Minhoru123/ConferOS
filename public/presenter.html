<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Backchannel presenter</title>
<style>
  body { font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; max-width: 640px; margin: 0 auto; padding: 16px; background: #F4F6F8; color: #15202B; }
  h1 { margin: 0 0 8px; }
  label { display: block; margin-top: 12px; font-weight: 700; }
  input, button { font: inherit; min-height: 44px; }
  input { width: 100%; padding: 8px 12px; box-sizing: border-box; border: 1px solid #D3DBE3; border-radius: 8px; }
  button { padding: 8px 14px; margin-top: 12px; border: 1px solid #0A6C74; border-radius: 8px; background: #0A6C74; color: #FFFFFF; font-weight: 700; cursor: pointer; }
  button.secondary { background: #FFFFFF; color: #0A6C74; }
  button[aria-pressed="true"] { background: #B42318; border-color: #B42318; }
  :focus-visible { outline: 3px solid #1D4ED8; outline-offset: 2px; }
  #interim { color: #475664; min-height: 1.5em; font-style: italic; }
</style>
</head>
<body>
<h1>Presenter</h1>
<p>Each sentence you finish speaking goes to the live transcript. The microphone works in Edge or Chrome, on localhost or over HTTPS. Put the <a href="/speaker.html">speaker screen</a> where the speaker can see it.</p>

<label for="key">Presenter key</label>
<input id="key" type="password" autocomplete="off">
<label for="who">Speaker name</label>
<input id="who" value="Speaker" autocomplete="off">

<button id="mic" type="button" aria-pressed="false">Start microphone</button>
<p id="interim"></p>
<p id="status" role="status"></p>

<form id="typeForm">
  <label for="text">Or type a line</label>
  <input id="text" autocomplete="off">
  <button type="submit">Send line</button>
</form>
<button id="replay" type="button" class="secondary">Restart demo script (clears the transcript)</button>

<script>
function $(id) { return document.getElementById(id); }
function say(msg) { $("status").textContent = msg; }

function post(path, body) {
  return fetch(path, {
    method: "POST",
    headers: { "Content-Type": "application/json", "x-presenter-key": $("key").value },
    body: JSON.stringify(body || {})
  }).then(function (r) {
    if (r.status === 401) throw new Error("Wrong presenter key.");
    if (!r.ok) throw new Error("The server refused it (" + r.status + ").");
  });
}
function send(text, source, lagMs) {
  return post("/api/lines", { text: text, who: $("who").value, source: source, lagMs: lagMs })
    .then(function () { say("Sent: " + text); }, function (e) { say(e.message); });
}

/* Browser speech recognition: interim words show here, finished sentences are sent.
   The last interim update is about when the speaker stopped, so the time from it to the final
   result is how late the caption is (the speaker screen warns when that runs over 6 s). */
var Rec = window.SpeechRecognition || window.webkitSpeechRecognition, rec = null, listening = false, lastHeardAt = 0;
function showMic() {
  $("mic").textContent = listening ? "Stop microphone" : "Start microphone";
  $("mic").setAttribute("aria-pressed", String(listening));
}
if (!Rec) { $("mic").disabled = true; say("This browser has no speech recognition. Type lines instead."); }
$("mic").onclick = function () {
  if (listening) { listening = false; rec.stop(); showMic(); return; }
  rec = new Rec();
  rec.lang = "en-US"; rec.continuous = true; rec.interimResults = true;
  rec.onresult = function (e) {
    var interim = "";
    for (var i = e.resultIndex; i < e.results.length; i++) {
      var r = e.results[i];
      if (r.isFinal) {
        var t = r[0].transcript.trim();
        if (t) send(t, "mic", lastHeardAt ? Date.now() - lastHeardAt : 0);
        lastHeardAt = 0;
      } else { interim += r[0].transcript; lastHeardAt = Date.now(); }
    }
    $("interim").textContent = interim;
  };
  rec.onerror = function (e) {
    if (e.error === "not-allowed" || e.error === "service-not-allowed") { listening = false; showMic(); }
    say("Microphone: " + e.error);
  };
  rec.onend = function () { if (listening) rec.start(); }; /* browsers stop after a silence; keep going until Stop */
  listening = true; rec.start(); showMic(); say("Listening.");
};

$("typeForm").onsubmit = function (e) {
  e.preventDefault();
  var t = $("text").value.trim();
  if (t) send(t, "typed").then(function () { $("text").value = ""; });
};
$("replay").onclick = function () {
  post("/api/replay").then(function () { say("Demo script restarted."); }, function (e) { say(e.message); });
};
</script>
</body>
</html>
